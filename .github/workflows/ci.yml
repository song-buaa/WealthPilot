name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      WEALTHPILOT_DB_PATH: /tmp/wealthpilot-${{ github.run_id }}-${{ github.run_attempt }}-pytest.db
      PUBLIC_DEMO_MODE: "true"
      DEMO_ACCESS_PASSWORD: ci-offline-only
      DEMO_ALLOW_MARKET_DATA: "false"
      BROKER_MODE: mock
      IBKR_READ_ONLY_MODE: "true"
      ENABLE_IBKR_LIVE_TRADING: "false"
      ENABLE_TIGER_LIVE_TRADING: "false"
      FUTU_READ_ONLY_MODE: "true"
      AV_DEV_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q app backend decision_engine intent_engine research_v2 tests
      - name: Check engineering document entrypoints and local links
        run: python scripts/check_engineering_docs.py
      - name: Run backend tests
        run: python -m pytest
      - name: Test native input fail-closed with isolated PowerShell fakes
        shell: pwsh
        run: |
          ./tests/test_guojin_native_input.ps1
          ./tests/test_guojin_native_gui.ps1 -PortableFake

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  offline-m5:
    name: Offline M5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      M5_MODE: offline
      PUBLIC_DEMO_MODE: "true"
      DEMO_ACCESS_PASSWORD: ci-offline-only
      DEMO_ALLOW_MARKET_DATA: "false"
      BROKER_MODE: mock
      IBKR_READ_ONLY_MODE: "true"
      ENABLE_IBKR_LIVE_TRADING: "false"
      ENABLE_TIGER_LIVE_TRADING: "false"
      FUTU_READ_ONLY_MODE: "true"
      AV_DEV_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run deterministic offline decision gate
        run: python scripts/m5_e2e_18_cases.py --mode offline

  mcp-poc-tests:
    name: MCP PoC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      WEALTHPILOT_DB_PATH: /tmp/wealthpilot-${{ github.run_id }}-${{ github.run_attempt }}-poc.db
      PUBLIC_DEMO_MODE: "true"
      DEMO_ACCESS_PASSWORD: ci-offline-only
      DEMO_ALLOW_MARKET_DATA: "false"
      BROKER_MODE: mock
      IBKR_READ_ONLY_MODE: "true"
      ENABLE_IBKR_LIVE_TRADING: "false"
      ENABLE_TIGER_LIVE_TRADING: "false"
      FUTU_READ_ONLY_MODE: "true"
      AV_DEV_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install business test dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Compile and test readonly adapter and deployment guards
        run: |
          python -m compileall -q pocs
          python -m pytest -q pocs/poc02_wealth_mcp/test_reader.py pocs/poc03_mac_mini/test_deployment.py pocs/poc03_mac_mini/test_github_release.py
          python -m pytest -q pocs/poc03_mac_mini/test_shared_database.py
          python -m pytest -q pocs/poc03_mac_mini/test_restricted_web.py
          PYTHONPATH=.:backend python -m pytest -q backend/services/broker_sync/tests tests/test_portfolio_sync_corrections.py
      - name: Verify pinned Tunnel CLI config contract on loopback
        run: |
          curl --fail --location --retry 2 https://github.com/openai/tunnel-client/releases/download/v0.0.16/tunnel-client-v0.0.16-linux-amd64.zip --output "$RUNNER_TEMP/tunnel-client.zip"
          echo "d60cdba019bce451bcc3a15478cc5b9cb11270b049f5b56ea39a80b517f8b117  $RUNNER_TEMP/tunnel-client.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/tunnel-client.zip" -d "$RUNNER_TEMP/tunnel-cli"
          export TUNNEL_CLIENT_BINARY="$(find "$RUNNER_TEMP/tunnel-cli" -type f -name tunnel-client)"
          chmod 700 "$TUNNEL_CLIENT_BINARY"
          python -m pytest -q pocs/poc03_mac_mini/test_tunnel_contract.py
      - name: Test both MCP HTTP servers in an independent environment
        run: |
          python -m venv "$RUNNER_TEMP/wealthpilot-mcp-poc"
          "$RUNNER_TEMP/wealthpilot-mcp-poc/bin/python" -m pip install -r pocs/poc01_private_mcp/requirements-dev.txt
          "$RUNNER_TEMP/wealthpilot-mcp-poc/bin/python" -m pytest -q pocs/poc01_private_mcp/tests/test_http.py
          "$RUNNER_TEMP/wealthpilot-mcp-poc/bin/python" -m pytest -q pocs/poc02_wealth_mcp/test_http.py
          WP_BUSINESS_PYTHON="$(which python)" "$RUNNER_TEMP/wealthpilot-mcp-poc/bin/python" -m pytest -q pocs/chatgpt_skills/test_protocol.py pocs/chatgpt_skills/test_u1_protocol.py
          MCP_TEST_PYTHON="$RUNNER_TEMP/wealthpilot-mcp-poc/bin/python" python -m pytest -q pocs/poc03_mac_mini/test_shared_database.py -k shared_mcp_http
          MCP_TEST_PYTHON="$RUNNER_TEMP/wealthpilot-mcp-poc/bin/python" python -m pytest -q pocs/poc03_mac_mini/test_restricted_web.py -k real_mcp_http
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Exercise restricted production React and manual sync on synthetic WAL
        run: |
          cd frontend
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          WP_TEST_PYTHON="$(which python)" npx playwright test tests/e2e/restricted-web.spec.ts tests/e2e/trade-link.spec.ts tests/e2e/asset-view.spec.ts tests/e2e/guojin-native.spec.ts --workers=1
