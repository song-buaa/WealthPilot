name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      WEALTHPILOT_DB_PATH: /tmp/wealthpilot-${{ github.run_id }}-${{ github.run_attempt }}-pytest.db
      PUBLIC_DEMO_MODE: "true"
      DEMO_ACCESS_PASSWORD: ci-offline-only
      DEMO_ALLOW_MARKET_DATA: "false"
      BROKER_MODE: mock
      IBKR_READ_ONLY_MODE: "true"
      ENABLE_IBKR_LIVE_TRADING: "false"
      ENABLE_TIGER_LIVE_TRADING: "false"
      FUTU_READ_ONLY_MODE: "true"
      AV_DEV_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q app backend decision_engine intent_engine research_v2 tests
      - name: Run backend tests
        run: python -m pytest

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  offline-m5:
    name: Offline M5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      M5_MODE: offline
      PUBLIC_DEMO_MODE: "true"
      DEMO_ACCESS_PASSWORD: ci-offline-only
      DEMO_ALLOW_MARKET_DATA: "false"
      BROKER_MODE: mock
      IBKR_READ_ONLY_MODE: "true"
      ENABLE_IBKR_LIVE_TRADING: "false"
      ENABLE_TIGER_LIVE_TRADING: "false"
      FUTU_READ_ONLY_MODE: "true"
      AV_DEV_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run deterministic offline decision gate
        run: python scripts/m5_e2e_18_cases.py --mode offline
